# timesheet2invoice configuration
# One config file per client. Paths are relative to this file.

[business]
name = "Your Agency LLC"
address = ["123 Main Street", "City, ST 00000"]
email = "billing@youragency.com"
phone = "(555) 555-5555"

[client]
name = "Client Company Inc."
contact = "Accounts Payable"
address = ["456 Client Ave", "City, ST 00000"]
email = "ap@client.com"

[billing]
hourly_rate = 100.00
net_days = 15              # payment due this many days after the invoice date
currency = "$"
tax_percent = 0            # e.g. 8.25 adds a tax line; 0 omits it
group_by = "project"       # project | description | day | entry
round_minutes = 15         # round each line to this increment; 0 = exact
rounding = "nearest"       # nearest | up
# date_format = "%d/%m/%Y" # only needed if your export uses day-first dates

[invoice]
prefix = "INV"             # numbers look like INV-2026-001
start_number = 1           # first number to use when the ledger is empty
output_dir = "invoices"
ledger = "invoices/ledger.csv"
include_time_log = true    # add a page listing every time entry
accent_color = "#1f3a5f"
payment_instructions = [
  "ACH: Bank Name, Routing #XXXXXXXXX, Account #XXXXXXXX",
  "Or mail a check payable to Your Agency LLC",
]
notes = "Thank you for your business!"

# Optional: pull hours straight from your tracker instead of exporting a CSV.
# Then run `timesheet2invoice generate` with no CSV argument.
# [source]
# tracker = "harvest"        # harvest | toggl | clockify
# account_id = "123456"      # Harvest only; shown next to your token
# client = "Client Company Inc."  # only bill this client's entries (name as in the tracker)
# The token is read from an environment variable, so it stays out of this file:
#   HARVEST_ACCESS_TOKEN  https://id.getharvest.com/developers
#   TOGGL_API_TOKEN       https://track.toggl.com/profile
#   CLOCKIFY_API_KEY      https://app.clockify.me/user/preferences#advanced
# token_env = "HARVEST_ACCESS_TOKEN"  # use a different variable name, e.g. one per account
# workspace_id = ""          # Toggl / Clockify; default is your default/current workspace
# all_users = false          # Harvest: true bills everyone's time the token can see, not just yours
# billable_only = true       # false bills every entry (e.g. Toggl's free plan has no billable flag)
